name: Build and deployment diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jogaplacas_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jogaplacas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma
        run: npx prisma validate
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Create AI-readable report
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo '# CI diagnostic report'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'See this workflow run for step-by-step output and the first real error.'
            echo 'This report covers GitHub CI, not internal Hydro deployment logs.'
          } > diagnostics/latest-ci.md
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_number }}
          path: diagnostics/latest-ci.md
          if-no-files-found: warn
          retention-days: 30
