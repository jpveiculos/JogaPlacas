name: Temporary Dependency Audit

on:
  push:
    branches: [planning/foundation]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency tree
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            console.log("SUMMARY", JSON.stringify(a.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) {
              console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:(item.via ?? []).map(v => typeof v === "string" ? v : {title:v.title,url:v.url,range:v.range})}));
            }
          '
