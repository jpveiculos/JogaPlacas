name: Bootstrap dependency lockfile

on:
  push:
    branches: [planning/foundation]

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    if: github.ref == 'refs/heads/planning/foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: planning/foundation
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without running package scripts
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json already exists; no changes needed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          test -s package-lock.json
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Audit resolved dependency tree
        if: steps.lockfile.outputs.created == 'true'
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: steps.lockfile.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-foundation
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit only the generated lockfile
        if: steps.lockfile.outputs.created == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:planning/foundation
